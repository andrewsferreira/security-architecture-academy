# Publicação no GitHub Pages — SOMENTE MANUAL.
#
# PUBLICATION FREEZE: não há gatilho em push. O deploy só ocorre quando o
# proprietário executa este workflow em Actions → "Deploy to GitHub Pages" →
# "Run workflow", depois da aprovação da release pelo mantenedor.
# Builds e validações continuam rodando em todo PR e push pelo ci.yml.
#
# Gates (qualquer falha impede o deploy):
#   1. Execução manual na main, com a confirmação "publicar".
#   2. A main é exatamente o commit informado na execução (release_commit) e,
#      se a tag existir no repositório, a tag aponta para esse mesmo commit
#      (sem mudanças posteriores não revisadas).
#   3. RELEASE-MANIFEST.yml: árvore idêntica à exportada (SHA-256 de cada
#      arquivo), modo final, aprovação do mantenedor e commit de origem.
#   4. Atribuição de autoria: arquivos, mensagens de commit e site compilado.
#   5. CHANGELOG da versão (check_changelog.py --release --tag), validações de
#      publicação (--release), testes, build e links internos.
#
# Depois do deploy, o job "Smoke tests" consulta o site publicado (somente leitura).
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite "publicar" para confirmar que a release foi aprovada pelo mantenedor'
        required: true
        type: string
      release_tag:
        description: "Versão publicada (ex.: v0.1.0) — precisa coincidir com o RELEASE-MANIFEST.yml"
        required: true
        type: string
      release_commit:
        description: "SHA completo (40 caracteres) do commit a publicar — precisa ser o commit atual da main"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validar e construir
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publicar'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Commit autorizado
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_COMMIT: ${{ inputs.release_commit }}
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag inválida: use vMAJOR.MINOR.PATCH"; exit 1
          fi
          if ! printf '%s' "$RELEASE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::release_commit deve ser o SHA completo do commit"; exit 1
          fi
          if [ "$RELEASE_COMMIT" != "$GITHUB_SHA" ]; then
            echo "::error::a main ($GITHUB_SHA) não é o commit informado ($RELEASE_COMMIT)"; exit 1
          fi
          if tag_commit="$(git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}")"; then
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "::error::a tag ${RELEASE_TAG} aponta para $tag_commit, não para $GITHUB_SHA"; exit 1
            fi
          else
            echo "::notice::tag ${RELEASE_TAG} ainda não existe; publicação vinculada ao commit $GITHUB_SHA"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Manifesto da release (integridade e aprovação)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/verify_release_manifest.py --require-approval --tag "$RELEASE_TAG"
      - name: CHANGELOG da versão publicada
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/check_changelog.py --release --tag "$RELEASE_TAG"
      - name: Atribuição de autoria (arquivos e commits)
        run: python scripts/check_attribution.py --commits HEAD
      - name: Validações de publicação (bloqueia rascunhos)
        run: |
          python scripts/check_structure.py --release
          python scripts/validate_manifest.py --release
          python scripts/render_curriculum.py --check
          python scripts/check_assets.py
          python scripts/check_contrast.py
          python scripts/check_decision_matrices.py
          python scripts/validate_references.py
      - name: Build
        run: python -m zensical build --clean
      - name: Links internos
        run: python scripts/check_links.py
      - name: Atribuição de autoria no site compilado
        run: python scripts/check_attribution.py --path site
      - name: Testes
        run: python -m pytest -q tests examples
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Conferência do site publicado. Só leitura: não refaz o deploy. Tentativas limitadas cobrem a
  # propagação do Pages; uma falha aqui indica divergência a investigar, não dispara nova publicação.
  smoke:
    name: Smoke tests do site publicado
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Páginas, versão, sitemap, assets e endereços proibidos
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python scripts/smoke_test_site.py --base-url "$PAGE_URL" --expect-version "$RELEASE_TAG"
