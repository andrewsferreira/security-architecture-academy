# =============================================================================
# Allowlist do repositório público
#
# Só os caminhos listados aqui podem chegar ao repositório público. Dentro deles,
# scripts/export_release.py ainda remove tudo o que estiver fora do escopo
# cumulativo da release (módulos, atividades, diagramas e conceitos de releases
# futuras). Qualquer arquivo novo fora desta lista fica, por padrão, apenas no
# repositório de desenvolvimento.
#
# files: caminhos exatos · directories: prefixos (o conteúdo versionado inteiro)
# =============================================================================

schema_version: 1

files:
  - README.md
  - GETTING-STARTED.md
  - CURRICULUM.md
  - CHANGELOG.md
  - ROADMAP.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - SECURITY.md
  - LICENSING.md
  - LICENSE
  - LICENSE-CODE
  - Makefile
  - zensical.toml
  - requirements.txt
  - requirements-dev.txt
  - requirements-brand.txt
  - .editorconfig
  - .gitattributes
  - .gitignore
  - .markdownlint-cli2.jsonc

directories:
  - .github/
  - assets/
  - curriculum/
  - docs/
  - examples/
  - includes/
  - overrides/
  - research/
  - scripts/
  - tests/

# Exceções dentro dos diretórios acima: ficam só no desenvolvimento.
# Documentação operacional (Handbook, templates de autoria, padrões internos, preparação do
# ambiente de manutenção) não é conteúdo educacional e não vai ao Pages nem ao repositório
# público. Diretórios terminam em "/".
exclude:
  - docs/internal/                       # Handbook de manutenção e relatórios internos
  - docs/getting-started/local-development.md   # preparação do ambiente de manutenção do portal
  - authoring/                           # templates de autoria
  - PROJECT-STANDARDS.md                 # padrões internos de produção e publicação
  - private-research/README.md           # pasta local de cópias de pesquisa (ignorada pelo git)
  - .github/dependabot.yml               # atualizações de dependências acontecem no desenvolvimento
  - scripts/export_landing.py            # gera a página institucional anterior à Release 1

# Ficam só no desenvolvimento (documentado para revisão; a allowlist já os exclui):
# PROGRESS.md, RELEASE-PLAN.md, RELEASE-*-REVIEW-PACKAGE.md, FINAL-CONSOLIDATION-REPORT.md,
# ACADEMIC-COMPLETENESS-REPORT.md, PUBLICATION-READINESS-CHECKLIST.md,
# FUNDAMENTALS-PUBLICATION-READINESS.md e arquivos locais de ferramentas.
