  tier: professional
  learning_type: prática
  application: Registrar decisões com contexto e consequências, substituindo em vez de editar decisões aceitas.
  limitations: Formato mínimo; não trata de governança de decisões em escala.
  examples: ADR-001 a ADR-003 do Caso A.
