  limitations: Seção localizada pelo sumário; conteúdo a ler.
  examples: Reescrita de requisitos vagos (M02-L07, Tarefa 3 da avaliação do módulo).
- id: KC-R1-14
  concept: Processos técnicos do ciclo de vida, da missão à validação
