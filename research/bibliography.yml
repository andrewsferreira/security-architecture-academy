# =============================================================================
# Research Library — registro bibliográfico da Security Architecture Academy
#
# Fonte única das referências usadas no currículo. Substitui curriculum/sources.yml
# (schema 1). Validado por scripts/validate_references.py e renderizado nas
# páginas de docs/resources/ por scripts/render_curriculum.py.
#
# Três estados independentes (não confundir acesso gratuito com licença aberta):
#   availability:   Free Download | Free Online Reading | Free With Registration |
#                   Paid | Restricted | Unknown
#   redistribution: Explicitly Permitted | Restricted | Prohibited | Not Verified
#   verification:   Verified | Partially Verified | Unavailable | Pending
#
# chapters[].consulted: true somente quando o capítulo/seção foi efetivamente
# aberto na data de verificação. pages + page_basis: printed = numeração impressa
# (cabeçalhos), pdf = índice físico do arquivo. Nunca inventar páginas.
#
# reading_role: essential | deep-dive | reference | exercises | projects
# priority: 1 (ler primeiro) a 3 (consulta)
# =============================================================================

