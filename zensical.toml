# =============================================================================
# Security Architecture Academy — configuração do portal (Zensical)
# Referência: https://zensical.org/docs/
#
# Regra de navegação: somente páginas com conteúdo real entram em `nav`.
# Módulos planejados existem apenas em curriculum/manifest.yml. Páginas
# `in-review` podem estar em nav em branches de revisão; o deploy da `main`
# exige `published` (validate_manifest.py --release, check_structure.py --release).
# =============================================================================

[project]
site_name = "Security Architecture Academy"
site_url = "https://andrewsferreira.github.io/security-architecture-academy/"
site_description = "Plataforma educacional aberta de Arquitetura de Segurança da Informação — Enterprise, Cloud e Hybrid."
site_author = "Andrews Ferreira"
copyright = "Security Architecture Academy — conteúdo sob CC BY 4.0 e código sob MIT. Projeto educacional independente, sem afiliação com as organizações citadas."
repo_url = "https://github.com/andrewsferreira/security-architecture-academy"
repo_name = "andrewsferreira/security-architecture-academy"
edit_uri = "edit/main/docs/"
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascripts/a11y.js"]

