  subject: Táticas e técnicas de adversários
  billing_risk: Nenhum
  prerequisites: M01
  notes: 'Página de atualizações conferida: versão atual v20, de 13/10/2026. Página de táticas Enterprise lida em 2026-10-23 (conteúdo v20.0): 15 táticas — Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Stealth (TA0005), Defense Impairment (TA0112), Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration, Impact. Termos de uso (página Legal & Branding) não verificados. Técnicas conferidas nas páginas da v20: T1133 External Remote Services (Persistence, Initial Access), T1078 Valid Accounts (Stealth, Persistence, Privilege Escalation, Initial Access), T1003 OS Credential Dumping, T1087 Account Discovery, T1021 Remote Services, T1685 Disable or Modify Tools (Defense Impairment, 18 técnicas), T1490 Inhibit System Recovery e T1486 Data Encrypted for Impact (Impact). T1558 Steal or Forge Kerberos Tickets (Credential Access) conferida, com subtécnicas .001 Golden Ticket, .002 Silver Ticket, .003 Kerberoasting, .004 AS-REP Roasting e .005 Ccache Files. Reconferido em 2026-10-28: página de versões (v20.0 desde 13/10/2026; v19.2 de 28/04/2026 a 12/10/2026; v18.1 de 28/10/2025 a 27/04/2026); lista de 15 táticas Enterprise; T1078 (Stealth, Persistence, Privilege Escalation, Initial Access), T1133 (Persistence, Initial Access) e T1490 (Impact); página da TA0112 Defense Impairment criada em 14/04/2026 (anterior à v20), com 18 técnicas. As páginas de versões anteriores (/versions/v19, /versions/v18) não puderam ser lidas (robots), então a versão exata em que a tática foi introduzida não foi confirmada. Também em 2026-10-28: T1003 (Credential Access), T1685 (Defense Impairment), T1070 Indicator Removal (Stealth; subtécnicas .003 a .010), T1566 Phishing (Initial Access), T1213 e T1530 (Collection), T1567 (Exfiltration) e T1598 Phishing for Information (Reconnaissance; objetivo de obter dados da vítima, frequentemente credenciais, em vez de executar código).'
