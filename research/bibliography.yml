  concepts:
  - Comunicação à ANPD e ao titular em três dias úteis
  - Critérios de risco ou dano relevante
  - Registro de incidentes por no mínimo cinco anos
  billing_risk: Nenhum
  prerequisites: —
  notes: 'Texto integral conferido em 2026-10-28 na Biblioteca Digital do Ministério da Justiça (cópia oficial, que declara não substituir o original publicado no DOU), com ementa "Aprova o Regulamento de Comunicação de Incidente de Segurança" e assinatura do Diretor-Presidente: art. 5º, caput e incisos I a VI (risco ou dano relevante quando puder afetar significativamente interesses e direitos fundamentais e, cumulativamente, envolver ao menos um critério — dados sensíveis; de crianças, adolescentes ou idosos; financeiros; de autenticação em sistemas; protegidos por sigilo legal, judicial ou profissional; em larga escala); art. 6º, caput (três dias úteis para comunicar a ANPD, ressalvado prazo previsto em legislação específica), § 1º (contagem a partir do conhecimento pelo controlador de que o incidente afetou dados pessoais), § 3º (complementação fundamentada em vinte dias úteis), § 5º (comunicação pelo controlador, por meio do encarregado) e § 8º (prazos do caput e do § 3º em dobro para agentes de pequeno porte); art. 9º, caput (três dias úteis para comunicar o titular, contados do mesmo conhecimento) e § 6º (em dobro para agentes de pequeno porte); art. 10, caput (registro do incidente, inclusive do não comunicado, por no mínimo cinco anos a partir do registro). O art. 2º da resolução altera o regulamento de agentes de pequeno porte (Resolução CD/ANPD nº 2/2022). A cópia integral não mostra a data de publicação; o registro do mesmo item na Biblioteca Digital do Ministério da Justiça (<https://bibliotecadigital.mj.gov.br/handle/1/12879>, conferido em 2026-10-28) informa a fonte "Diário Oficial da União, Seção 1, p. 114-115" e a data 2024-04-26. A página do próprio Diário Oficial não foi lida. Orientação oficial da ANPD sobre comunicação de incidente de segurança conferida no mesmo dia (gov.br/anpd, página publicada em 23/12/2022 e modificada em 26/08/2026): três dias úteis para a ANPD e os titulares (arts. 6º e 9º), complementação em vinte dias úteis a contar da comunicação, comunicação pelo encarregado ou representante legal por peticionamento eletrônico no SEI!ANPD; a página não trata dos prazos em dobro nem do registro interno. Em 2026-10-28, antes desta conferência, o mesmo texto tinha sido conferido em reprodução integral (Normas Brasil), porque o portal da ANPD estava indisponível.'
