# Mapa de conhecimento público gerado por scripts/export_release.py — escopo até R1.
schema_version: 1
updated: 2026-10-23
concepts:
- id: KC-R1-01
  concept: Policy, mechanism, assurance e incentive
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 1, §1.2 A framework (p. 4)
  consulted: true
  modules:
  - M01
  - M02
  lessons:
  - M02-L01
  tier: fundamental
  learning_type: conceito
  application: Estruturar a análise de qualquer controle em quatro perguntas — o que deve ser alcançado, com que mecanismo, com quanta confiança e com quais incentivos.
  limitations: Framework analítico, não um método de projeto; não define artefatos nem processo.
  examples: Revisar a decisão de MFA no Caso A pelas quatro perspectivas, incluindo o incentivo da seguradora.
- id: KC-R1-02
  concept: Trusted versus trustworthy
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 1, §1.7 Definitions (p. 11)
  consulted: true
  modules:
  - M01
  - M02
  - M07
  lessons:
  - M01-L01
  - M02-L01
  diagrams:
  - m01-l03-attack-surface
  tier: fundamental
  learning_type: conceito
  application: Identificar quais componentes, se falharem, quebram a política (trusted) e exigir evidência de que merecem essa posição (trustworthy).
  limitations: Definições gerais; não indicam como medir o quanto um componente é confiável.
  examples: Exercício de listar os componentes "trusted" de uma arquitetura de acesso remoto e a evidência de cada um.
- id: KC-R1-03
  concept: Controle de acesso em camadas (aplicação, middleware, sistema operacional, hardware)
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 6, §6.1–6.3 (pp. 207–231)
  consulted: true
  modules:
  - M01
  - M02
  - M06
  - M08
  lessons:
  - M01-L02
  - M02-L03
  - M02-L04
  diagrams:
  - m01-l02-defense-in-depth
  tier: professional
  learning_type: conceito
  application: Decidir em que camada cada regra de acesso deve ser aplicada e evitar depender só da camada mais expressiva e menos confiável.
  limitations: Foco em sistemas e plataformas; não trata de federação de identidade corporativa ou cloud IAM.
  examples: Mapear as camadas de controle de acesso de um serviço de pedidos — da autorização por objeto ao isolamento por container.
- id: KC-R1-04
  concept: ACLs versus capabilities; DAC versus MAC
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 6, §6.2.2, §6.2.4 e §6.2.5 (pp. 211–217)
  consulted: true
  modules:
  - M01
  - M06
  lessons:
  - M00-L01
  - M01-L02
  tier: professional
  learning_type: conceito
  application: Escolher o modelo de representação de permissões conforme a necessidade de auditoria, revogação e delegação.
  limitations: Exemplos centrados em sistemas operacionais.
  examples: Comparar políticas baseadas em recurso e em identidade de um provedor cloud com ACLs e capabilities.
- id: KC-R1-05
  concept: Environmental creep — controles que se degradam quando o ambiente muda
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 6, §6.4.5 Environmental creep (p. 238)
  consulted: true
  modules:
  - M02
  - M08
  - M14
  lessons:
  - M02-L04
  diagrams:
  - m02-l04-exception-flow
  tier: professional
  learning_type: conceito
  application: Justificar revisão periódica de padrões, baselines e exceções quando o contexto de uso muda.
  limitations: Discussão breve; não propõe processo de revisão.
  examples: Revisitar a exceção do servidor de etiquetas do Caso A quando os coletores passarem a usar Wi-Fi.
- id: KC-R1-06
  concept: Economia da segurança — externalidades, informação assimétrica e incentivos desalinhados
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 8, §8.3 e §8.6 (pp. 281–308)
  consulted: true
  modules:
  - M02
  - M03
  - M14
  - M16
  lessons:
  - M02-L02
  tier: architect
  learning_type: conceito
  application: Explicar à diretoria por que um controle falha quando quem o opera não arca com o custo da falha, e redesenhar responsabilidades.
  limitations: Análise econômica qualitativa; não fornece modelo de quantificação de risco.
  examples: Discussão sobre quem deve ser o dono do risco do backup no Caso A.
- id: KC-R1-07
  concept: Compartimentação e fronteiras entre pares (segurança multilateral)
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 10, §10.1–10.2 (pp. 341–346) e §10.4.8 Chinese Wall (p. 369)
  consulted: true
  modules:
  - M01
  - M05
  - M13
  lessons:
  - M01-L03
  - M01-L07
  diagrams:
  - m01-l07-blp-biba
  tier: professional
  learning_type: conceito
  application: Desenhar fronteiras que impeçam fluxos laterais entre unidades de negócio ou clientes, não apenas entre níveis hierárquicos.
  limitations: Exemplos de saúde, inteligência e serviços financeiros; adaptação a segmentação de rede é do arquiteto.
  examples: Segmentação entre subsidiárias em um grupo empresarial (Caso C futuro).
- id: KC-R1-08
  concept: Gestão de risco e priorização de objetivos de proteção no desenvolvimento
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 27, §27.2 Risk management (p. 966) e §27.4 Prioritising protection goals (p. 978)
  consulted: true
  modules:
  - M02
  - M03
  - M04
  lessons:
  - M01-L06
  - M02-L07
  diagrams:
  - m02-l07-traceability
  tier: professional
  learning_type: método
  application: Separar, em uma estimativa de risco, o que é dado, o que é suposição e o que é negociação — e priorizar objetivos de proteção com o negócio.
  limitations: Não prescreve uma escala de risco específica.
  examples: Exercício de decisão da aula M02-L07 com estimativas explicitamente marcadas como suposições.
- id: KC-R1-09
  concept: Threat modelling, fault trees e FMEA
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 27, §27.3.3–27.3.5 (pp. 971–975)
  consulted: true
  modules:
  - M04
  - M12
  lessons:
  - M01-L06
  tier: professional
  learning_type: método
  application: Escolher a técnica de análise conforme o problema — árvores para caminhos de ataque, FMEA para modos de falha, threat modelling para fronteiras de confiança.
  limitations: Visão comparativa; o passo a passo de cada técnica fica para fontes específicas.
  examples: Laboratório do M04 com árvore de ataque e threat model do mesmo sistema.
- concept: Metodologias top-down, iterativa e DevSecOps
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 27, §27.5 Methodology (pp. 980–995)
  consulted: true
  modules:
  - M02
  - M12
  tier: professional
  learning_type: método
  application: Posicionar a revisão de arquitetura em ciclos ágeis sem transformá-la em gargalo.
  limitations: Exemplos de ecossistemas específicos (Azure, Google) refletem o período de escrita.
  examples: Desenho do modelo de engajamento do arquiteto (M02-L01).
- id: KC-R1-10
  concept: Assurance como processo contínuo; limites da avaliação e certificação
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 28, §28.1–28.3 (pp. 1015–1044)
  consulted: true
  modules:
  - M03
  - M14
  - M16
  lessons:
  - M02-L06
  tier: architect
  learning_type: conceito
  application: Tratar certificações e avaliações como evidência parcial e planejar manutenção e correção durante todo o ciclo de vida.
  limitations: Discussão crítica de regimes de avaliação; não substitui os requisitos de um programa de conformidade específico.
  examples: Discussão sobre o que uma certificação de fornecedor garante — e o que não garante — no M03.
- id: KC-R1-11
  concept: Sete princípios (tenets) de Zero Trust
  ref: NIST-SP800-207
  locator: §2.1 Tenets of Zero Trust (p. 6)
  consulted: true
  modules:
  - M02
  - M07
  lessons:
  - M00-L07
  - M02-L05
  tier: professional
  learning_type: conceito
  application: Avaliar uma arquitetura pelos sete princípios — recurso, comunicação protegida, acesso por sessão, política dinâmica, monitoramento de postura, reavaliação contínua e coleta de dados.
  limitations: Princípios orientadores; o documento não define níveis de maturidade nem métricas.
  examples: Checklist de revisão que pergunta, para cada fluxo do Caso A, quais princípios o To-Be atende.
- concept: Componentes lógicos (PDP, PEP) e modelos de implantação
  ref: NIST-SP800-207
  locator: §3 Logical Components (p. 9); §3.2 Deployed Variations (p. 13); §3.3 Trust Algorithm (p. 17)
  consulted: false
  modules:
  - M07
  - M11
  tier: professional
  learning_type: conceito
  application: Projetar decisões de acesso por recurso, avaliadas continuamente, com pontos de decisão e de aplicação explícitos.
  limitations: Arquitetura abstrata; não prescreve produtos nem sequência de migração detalhada.
  examples: Lab do M07 com PDP/PEP simulados para um aplicativo interno.
- concept: Coexistência de Zero Trust com o perímetro (arquitetura híbrida)
  ref: NIST-SP800-207
  locator: §7.2 Hybrid ZTA and Perimeter-Based Architecture (p. 36); §4.2 Multi-cloud/Cloud-to-Cloud Enterprise (p. 24)
  consulted: false
  modules:
  - M07
  - M11
  - M16
  tier: architect
  learning_type: método
  application: Planejar a migração gradual de uma rede de perímetro para decisões de acesso por recurso, mantendo os dois modelos por um período.
  limitations: Orientação de alto nível, escrita para agências federais dos EUA.
  examples: Roadmap de 12 meses da Meridiana (Caso A) relido como migração parcial para Zero Trust.
- id: KC-R1-12
  concept: Princípios de design seguro e confiável
  ref: NIST-SP800-160-V1R1
  locator: Apêndice E, Principles for Trustworthy Secure Design, E.1–E.30 (p. 82)
  consulted: false
