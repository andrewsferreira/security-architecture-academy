# Atualizações mensais e agrupadas, para não fragmentar revisões.
# Cada PR do Dependabot passa pelo CI completo antes do merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
