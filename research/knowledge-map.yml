  tier: fundamental
  learning_type: conceito
  application: Fundamentar os princípios ensinados (defense in depth, least privilege, mediated access, minimal trusted elements) na lista normativa do NIST.
  limitations: Nomes e numeração conferidos no sumário; definições ainda a conferir no texto.
