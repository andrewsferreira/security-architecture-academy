- id: KC-M00-01
  concept: Fronteiras de isolamento — kernel, hipervisor e containers
  ref: BOOK-ANDERSON-SE3
  locator: Cap. 6, §6.2.11 Sandboxing (p. 224) e §6.2.12 Virtualisation (p. 225)
  consulted: true
  modules:
  - M00
  - M01
  lessons:
  - M00-L01
  - M00-L05
  diagrams:
  - m00-l01-isolation
  tier: fundamental
  learning_type: conceito
  application: Escolher entre processo, container, VM ou host separado conforme a diferença de confiança entre as cargas.
  limitations: Anderson discute mecanismos e seus limites; não prescreve critérios de consolidação.
  examples: Agendamento exposto da Lumen Saúde em VM e segmento separados dos prontuários.
- id: KC-M00-02
  concept: Faixas de endereçamento privado e o papel do NAT
  ref: RFC-1918
  locator: RFC 1918 (BCP 5), faixas 10/8, 172.16/12 e 192.168/16
  consulted: true
  modules:
  - M00
  - M05
  lessons:
  - M00-L02
  diagrams:
  - m00-l02-packet-path
  tier: fundamental
  learning_type: conceito
  application: Planejar endereçamento corporativo sem sobreposição e reconhecer que NAT é tradução, não política de segurança.
  limitations: Não trata segurança; NAT e encaminhamento de porta podem expor hosts com endereço privado.
  examples: RDP publicado por encaminhamento de porta na Meridiana.
