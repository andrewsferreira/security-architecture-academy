# =============================================================================
# Security Architecture Academy — página institucional (Zensical)
# Configuração da fase anterior à Release 1: uma única página com o objetivo do
# projeto e os fundamentos que serão tratados. Fonte: landing/ no repositório de
# desenvolvimento; publicada por scripts/export_landing.py. Será substituída pela
# configuração completa do portal quando a Release 1 for publicada.
# =============================================================================
[project]
site_name = "Security Architecture Academy"
site_url = "https://andrewsferreira.github.io/security-architecture-academy/"
site_description = "Plataforma educacional aberta de Arquitetura de Segurança da Informação — Enterprise, Cloud e Hybrid."
site_author = "Andrews Ferreira"
copyright = "Security Architecture Academy — conteúdo sob CC BY 4.0 e código sob MIT. Projeto educacional independente, sem afiliação com as organizações citadas."
repo_url = "https://github.com/andrewsferreira/security-architecture-academy"
repo_name = "andrewsferreira/security-architecture-academy"
extra_css = ["assets/stylesheets/extra.css"]
extra_javascript = ["assets/javascripts/a11y.js"]

nav = [
  { "Início" = "index.md" },
]

[project.theme]
language = "pt-BR"
custom_dir = "overrides"
logo = "assets/branding/symbol-dark.svg"
favicon = "assets/branding/favicon.png"
# Fontes servidas localmente (docs/assets/fonts) — sem requisições a terceiros.
font = false
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Mudar para o modo claro"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Mudar para o modo escuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Seguir a preferência do sistema"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/andrewsferreira/security-architecture-academy"
name = "Repositório no GitHub"

[project.extra]
generator = false

# -----------------------------------------------------------------------------
# Markdown
# -----------------------------------------------------------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.permalink_title = "Link para esta seção"
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
# Âncoras por linha geram links sem texto acessível (axe: link-name); desativadas.
pymdownx.highlight.anchor_linenums = false
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = { copyright = false }  # "(c)" é alternativa de questão, não ©
pymdownx.snippets.base_path = ["includes", "."]
pymdownx.snippets.auto_append = ["includes/abbreviations.md"]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
